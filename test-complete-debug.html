<!DOCTYPE html>
<html>
<head>
    <title>完整调试黄金价格问题</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body>
    <h1>完整调试黄金价格问题</h1>
    <div id="results">正在调试...</div>
    
    <script>
        async function completeDebug() {
            const resultsDiv = document.getElementById('results');
            let debugInfo = '<h2>🔍 完整调试信息</h2>';
            
            // 清除所有缓存
            localStorage.clear();
            sessionStorage.clear();
            debugInfo += '<p>✅ 已清除本地缓存</p>';
            
            try {
                // 1. 直接测试 investing-proxy 函数
                debugInfo += '<h3>1. 测试 investing-proxy 函数</h3>';
                
                const startTime = Date.now();
                const response = await axios.get('/.netlify/functions/investing-proxy', {
                    params: { 
                        symbol: 'gold',
                        range: '5d'
                    },
                    timeout: 30000
                });
                const endTime = Date.now();
                
                debugInfo += `<p>✅ 响应时间: ${endTime - startTime}ms</p>`;
                debugInfo += `<p>✅ 状态码: ${response.status}</p>`;
                
                if (response.data && response.data.priceData) {
                    const latest = response.data.priceData[response.data.priceData.length - 1];
                    debugInfo += `<div style="background: #e6f3ff; padding: 15px; border-radius: 8px; margin: 10px 0;">`;
                    debugInfo += `<h4>📊 API返回的价格数据</h4>`;
                    debugInfo += `<p><strong>最新价格:</strong> $${latest.close}</p>`;
                    debugInfo += `<p><strong>数据源:</strong> ${response.data.meta?.source || '未知'}</p>`;
                    debugInfo += `<p><strong>数据点数量:</strong> ${response.data.priceData.length}</p>`;
                    
                    // 检查价格范围
                    const prices = response.data.priceData.map(item => item.close);
                    const minPrice = Math.min(...prices);
                    const maxPrice = Math.max(...prices);
                    const avgPrice = prices.reduce((a, b) => a + b, 0) / prices.length;
                    
                    debugInfo += `<p><strong>价格范围:</strong> $${minPrice.toFixed(2)} - $${maxPrice.toFixed(2)}</p>`;
                    debugInfo += `<p><strong>平均价格:</strong> $${avgPrice.toFixed(2)}</p>`;
                    
                    if (avgPrice >= 4000) {
                        debugInfo += `<p style="color: green; font-weight: bold;">✅ API返回正确价格范围 (4000+)</p>`;
                    } else if (avgPrice >= 2500 && avgPrice <= 3000) {
                        debugInfo += `<p style="color: red; font-weight: bold;">❌ API返回错误价格范围 (2500-3000)</p>`;
                        debugInfo += `<p style="color: red;">这表明API逻辑有问题或者在使用旧的演示数据</p>`;
                    } else {
                        debugInfo += `<p style="color: orange; font-weight: bold;">⚠️ API返回异常价格范围</p>`;
                    }
                    
                    debugInfo += `</div>`;
                    
                    // 显示所有价格数据
                    debugInfo += `<h4>📈 完整价格数据</h4>`;
                    debugInfo += `<table style="width: 100%; border-collapse: collapse; font-size: 12px;">`;
                    debugInfo += `<tr style="background: #f0f0f0;"><th style="border: 1px solid #ddd; padding: 5px;">日期</th><th style="border: 1px solid #ddd; padding: 5px;">开盘</th><th style="border: 1px solid #ddd; padding: 5px;">收盘</th><th style="border: 1px solid #ddd; padding: 5px;">最高</th><th style="border: 1px solid #ddd; padding: 5px;">最低</th></tr>`;
                    
                    response.data.priceData.forEach(item => {
                        const priceColor = item.close >= 4000 ? 'green' : item.close <= 3000 ? 'red' : 'orange';
                        debugInfo += `<tr>`;
                        debugInfo += `<td style="border: 1px solid #ddd; padding: 5px;">${item.date}</td>`;
                        debugInfo += `<td style="border: 1px solid #ddd; padding: 5px; color: ${priceColor};">$${item.open.toFixed(2)}</td>`;
                        debugInfo += `<td style="border: 1px solid #ddd; padding: 5px; color: ${priceColor}; font-weight: bold;">$${item.close.toFixed(2)}</td>`;
                        debugInfo += `<td style="border: 1px solid #ddd; padding: 5px; color: ${priceColor};">$${item.high.toFixed(2)}</td>`;
                        debugInfo += `<td style="border: 1px solid #ddd; padding: 5px; color: ${priceColor};">$${item.low.toFixed(2)}</td>`;
                        debugInfo += `</tr>`;
                    });
                    debugInfo += `</table>`;
                    
                } else {
                    debugInfo += `<p style="color: red;">❌ API没有返回价格数据</p>`;
                }
                
                // 2. 检查前端是否在使用这个API
                debugInfo += '<h3>2. 检查前端调用</h3>';
                
                // 模拟前端调用
                try {
                    const frontendResponse = await axios.get('/.netlify/functions/investing-proxy', {
                        params: { 
                            symbol: 'gold',
                            range: '5d'
                        },
                        timeout: 30000,
                        headers: {
                            'User-Agent': navigator.userAgent,
                            'Accept': 'application/json'
                        }
                    });
                    
                    debugInfo += `<p>✅ 前端调用成功</p>`;
                    
                    if (frontendResponse.data && frontendResponse.data.priceData) {
                        const frontendLatest = frontendResponse.data.priceData[frontendResponse.data.priceData.length - 1];
                        debugInfo += `<p>前端获取的最新价格: $${frontendLatest.close}</p>`;
                        
                        if (frontendLatest.close === response.data.priceData[response.data.priceData.length - 1].close) {
                            debugInfo += `<p style="color: green;">✅ 前端和直接调用结果一致</p>`;
                        } else {
                            debugInfo += `<p style="color: red;">❌ 前端和直接调用结果不一致</p>`;
                        }
                    }
                } catch (error) {
                    debugInfo += `<p style="color: red;">❌ 前端调用失败: ${error.message}</p>`;
                }
                
                // 3. 检查可能的问题
                debugInfo += '<h3>3. 问题分析</h3>';
                
                if (response.data && response.data.priceData) {
                    const avgPrice = response.data.priceData.reduce((sum, item) => sum + item.close, 0) / response.data.priceData.length;
                    
                    if (avgPrice < 3500) {
                        debugInfo += `<div style="background: #fff3cd; padding: 15px; border-radius: 8px; color: #856404;">`;
                        debugInfo += `<h4>🔍 发现问题：价格过低</h4>`;
                        debugInfo += `<p>平均价格 $${avgPrice.toFixed(2)} 明显低于预期的4000+</p>`;
                        debugInfo += `<p><strong>可能原因：</strong></p>`;
                        debugInfo += `<ul>`;
                        debugInfo += `<li>investing-proxy.js 中的 fetchInvestingGoldPrice() 函数失败</li>`;
                        debugInfo += `<li>回退到了 fetchBackupGoldPrice() 但返回了错误的价格</li>`;
                        debugInfo += `<li>最终回退到了固定的备用价格，但这个价格是错误的</li>`;
                        debugInfo += `<li>generateRealGoldData() 函数使用了错误的基准价格</li>`;
                        debugInfo += `</ul>`;
                        debugInfo += `<p><strong>解决方案：</strong></p>`;
                        debugInfo += `<ul>`;
                        debugInfo += `<li>检查 investing-proxy.js 中的备用价格设置</li>`;
                        debugInfo += `<li>确保 fetchBackupGoldPrice() 返回4400左右的价格</li>`;
                        debugInfo += `<li>检查 generateRealGoldData() 的输入参数</li>`;
                        debugInfo += `</ul>`;
                        debugInfo += `</div>`;
                    } else {
                        debugInfo += `<p style="color: green;">✅ API返回的价格范围正常</p>`;
                        debugInfo += `<p>如果页面还显示2600+，可能是：</p>`;
                        debugInfo += `<ul>`;
                        debugInfo += `<li>浏览器缓存问题</li>`;
                        debugInfo += `<li>前端代码还在使用旧的API端点</li>`;
                        debugInfo += `<li>前端有其他价格数据源</li>`;
                        debugInfo += `</ul>`;
                    }
                }
                
                // 4. 检查网络和缓存
                debugInfo += '<h3>4. 网络和缓存检查</h3>';
                debugInfo += `<p>当前URL: ${window.location.href}</p>`;
                debugInfo += `<p>用户代理: ${navigator.userAgent.substring(0, 100)}...</p>`;
                debugInfo += `<p>本地存储项数: ${Object.keys(localStorage).length}</p>`;
                debugInfo += `<p>会话存储项数: ${Object.keys(sessionStorage).length}</p>`;
                
                resultsDiv.innerHTML = debugInfo;
                
            } catch (error) {
                debugInfo += `<h2 style="color: red;">❌ 调试失败</h2>`;
                debugInfo += `<p style="color: red;">错误: ${error.message}</p>`;
                debugInfo += `<p>这可能表明：</p>`;
                debugInfo += `<ul>`;
                debugInfo += `<li>Netlify函数没有正确部署</li>`;
                debugInfo += `<li>网络连接问题</li>`;
                debugInfo += `<li>函数执行超时</li>`;
                debugInfo += `</ul>`;
                
                resultsDiv.innerHTML = debugInfo;
                console.error('完整调试失败:', error);
            }
        }
        
        // 页面加载后自动调试
        completeDebug();
        
        // 添加重新调试按钮
        setTimeout(() => {
            const retryButton = document.createElement('button');
            retryButton.textContent = '🔄 重新调试';
            retryButton.style.cssText = 'margin: 20px 10px; padding: 15px 30px; background: #dc3545; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold;';
            retryButton.onclick = completeDebug;
            document.body.appendChild(retryButton);
            
            // 添加强制刷新按钮
            const forceRefreshButton = document.createElement('button');
            forceRefreshButton.textContent = '🔄 强制刷新页面';
            forceRefreshButton.style.cssText = 'margin: 20px 10px; padding: 15px 30px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold;';
            forceRefreshButton.onclick = () => {
                // 清除所有缓存
                localStorage.clear();
                sessionStorage.clear();
                if ('caches' in window) {
                    caches.keys().then(names => {
                        names.forEach(name => {
                            caches.delete(name);
                        });
                    });
                }
                // 强制刷新
                window.location.reload(true);
            };
            document.body.appendChild(forceRefreshButton);
        }, 3000);
    </script>
</body>
</html>
</content>
