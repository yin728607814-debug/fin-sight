<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="version" content="1.0.3-20260203" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.supabase.co https://generativelanguage.googleapis.com https://query2.finance.yahoo.com https://api.exchangerate-api.com https://api.frankfurter.app http://fundgz.1234567.com.cn https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: https: blob:; manifest-src 'self';">
    
    <meta name="description" content="智能投资组合管理与AI分析系统" />
    
    <title>投资组合管理系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-slate-900 antialiased">
    <div id="root"></div>
    
    <!-- 注销所有 Service Worker -->
    <script>
      // 注销所有已注册的 Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister().then(function(success) {
              if (success) {
                console.log('✅ Service Worker 已注销');
              }
            });
          }
        });
      }
    </script>
    
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
