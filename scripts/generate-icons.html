<!DOCTYPE html>
<html>
<head>
  <title>生成PWA图标</title>
</head>
<body>
  <canvas id="canvas192" width="192" height="192"></canvas>
  <canvas id="canvas512" width="512" height="512"></canvas>
  <div>
    <a id="download192" download="icon-192.png">下载 192x192 图标</a><br>
    <a id="download512" download="icon-512.png">下载 512x512 图标</a>
  </div>

  <script>
    function drawIcon(canvas) {
      const ctx = canvas.getContext('2d');
      const size = canvas.width;
      const center = size / 2;
      
      // 背景渐变
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#10b981');
      gradient.addColorStop(1, '#059669');
      
      // 圆角矩形背景
      const radius = size * 0.2;
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fill();
      
      // 绘制图表图标
      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      const barWidth = size * 0.08;
      const barGap = size * 0.05;
      const baseY = center + size * 0.2;
      
      // 三个柱状图
      const bars = [
        { x: center - barWidth * 1.5 - barGap, height: size * 0.4 },
        { x: center - barWidth * 0.5, height: size * 0.25 },
        { x: center + barWidth * 0.5 + barGap, height: size * 0.35 }
      ];
      
      bars.forEach(bar => {
        ctx.fillRect(bar.x, baseY - bar.height, barWidth, bar.height);
      });
      
      // 底部线
      ctx.fillRect(center - size * 0.25, baseY, size * 0.5, size * 0.03);
      
      // 装饰圆点
      ctx.fillStyle = '#10b981';
      const dotRadius = size * 0.015;
      const dotY = baseY + size * 0.08;
      [-0.15, -0.05, 0.05, 0.15].forEach((offset, i) => {
        ctx.beginPath();
        ctx.arc(center + size * offset, dotY, dotRadius, 0, Math.PI * 2);
        ctx.fill();
      });
    }
    
    // 生成两个尺寸的图标
    drawIcon(document.getElementById('canvas192'));
    drawIcon(document.getElementById('canvas512'));
    
    // 设置下载链接
    document.getElementById('download192').href = document.getElementById('canvas192').toDataURL();
    document.getElementById('download512').href = document.getElementById('canvas512').toDataURL();
  </script>
</body>
</html>
