<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试A股实时数据API</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        button {
            background: #dc2626;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }
        button:hover {
            background: #b91c1c;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        .success {
            border-color: #10b981;
            background: #ecfdf5;
        }
        .error {
            border-color: #ef4444;
            background: #fef2f2;
        }
        pre {
            background: #1f2937;
            color: #f3f4f6;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.5;
        }
        .info {
            background: #dbeafe;
            border: 1px solid #3b82f6;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .data-point {
            background: white;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
            border-left: 3px solid #dc2626;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔴 A股实时数据API测试</h1>
        <p class="subtitle">测试新浪财经API是否返回今天（1月12号）的数据</p>
        
        <div class="info">
            <strong>📅 当前时间：</strong><span id="currentTime"></span><br>
            <strong>📊 预期：</strong>应该返回最近5个工作日的数据，包括今天（如果是交易日）
        </div>
        
        <button onclick="testAPI()" id="testBtn">测试API</button>
        <button onclick="clearCache()">清除缓存</button>
        
        <div id="result"></div>
    </div>

    <script>
        // 显示当前时间
        document.getElementById('currentTime').textContent = new Date().toLocaleString('zh-CN');
        
        async function testAPI() {
            const btn = document.getElementById('testBtn');
            const resultDiv = document.getElementById('result');
            
            btn.disabled = true;
            btn.textContent = '测试中...';
            resultDiv.innerHTML = '<div class="result">正在请求API...</div>';
            
            try {
                const response = await fetch('/.netlify/functions/sina-stock-proxy?symbol=sh000001&range=5d');
                const data = await response.json();
                
                if (response.ok) {
                    // 成功
                    let html = '<div class="result success">';
                    html += '<h3>✅ API调用成功</h3>';
                    html += `<p><strong>最新价格：</strong>${data.current}</p>`;
                    html += `<p><strong>最新日期：</strong>${data.date}</p>`;
                    html += `<p><strong>涨跌幅：</strong>${data.changePercent}%</p>`;
                    html += '<h4>价格数据点（最近5个工作日）：</h4>';
                    
                    if (data.priceData && Array.isArray(data.priceData)) {
                        data.priceData.forEach((point, index) => {
                            const date = new Date(point.date);
                            const dayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                            const dayName = dayNames[date.getDay()];
                            
                            html += `<div class="data-point">`;
                            html += `<strong>${index + 1}. ${point.date} (${dayName})</strong> - `;
                            html += `收盘: ${point.close}, `;
                            html += `涨跌: ${point.change} (${point.changePercent}%)`;
                            html += `</div>`;
                        });
                        
                        // 检查是否有今天的数据
                        const today = new Date().toISOString().split('T')[0];
                        const hasToday = data.priceData.some(p => p.date === today);
                        
                        if (hasToday) {
                            html += '<p style="color: #10b981; font-weight: bold; margin-top: 15px;">✅ 包含今天的数据！</p>';
                        } else {
                            html += `<p style="color: #f59e0b; font-weight: bold; margin-top: 15px;">⚠️ 没有今天(${today})的数据</p>`;
                        }
                    }
                    
                    html += '<h4>完整响应：</h4>';
                    html += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                    html += '</div>';
                    
                    resultDiv.innerHTML = html;
                } else {
                    // 错误
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <h3>❌ API调用失败</h3>
                            <p><strong>状态码：</strong>${response.status}</p>
                            <p><strong>错误信息：</strong>${data.error || data.message || '未知错误'}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ 请求失败</h3>
                        <p><strong>错误：</strong>${error.message}</p>
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = '测试API';
            }
        }
        
        function clearCache() {
            // 清除localStorage中的价格缓存
            const keys = Object.keys(localStorage);
            let cleared = 0;
            keys.forEach(key => {
                if (key.includes('price_') || key.includes('astock')) {
                    localStorage.removeItem(key);
                    cleared++;
                }
            });
            alert(`已清除 ${cleared} 个缓存项`);
        }
        
        // 页面加载时自动测试
        window.addEventListener('load', () => {
            setTimeout(testAPI, 500);
        });
    </script>
</body>
</html>
