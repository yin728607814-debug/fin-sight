<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>清除价格数据缓存</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .info {
      background: #f0f9ff;
      border-left: 4px solid #3b82f6;
      padding: 15px;
      margin: 20px 0;
      border-radius: 4px;
    }
    .warning {
      background: #fef3c7;
      border-left: 4px solid #f59e0b;
      padding: 15px;
      margin: 20px 0;
      border-radius: 4px;
    }
    .success {
      background: #d1fae5;
      border-left: 4px solid #10b981;
      padding: 15px;
      margin: 20px 0;
      border-radius: 4px;
      display: none;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    button:active {
      transform: translateY(0);
    }
    .cache-list {
      background: #f9fafb;
      padding: 15px;
      border-radius: 6px;
      margin: 15px 0;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
    .cache-item {
      padding: 5px 0;
      border-bottom: 1px solid #e5e7eb;
    }
    .cache-item:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧹 清除价格数据缓存</h1>
    
    <div class="info">
      <strong>📋 说明：</strong><br>
      此工具将清除所有价格数据相关的缓存，包括：
      <ul style="margin: 10px 0; padding-left: 20px;">
        <li>黄金价格缓存</li>
        <li>纳斯达克100指数缓存</li>
        <li>A股上证指数缓存</li>
        <li>所有演示数据缓存</li>
      </ul>
      清除后，下次访问页面时将从真实API获取最新数据。
    </div>

    <div class="warning">
      <strong>⚠️ 注意：</strong><br>
      清除缓存后，页面将自动刷新并重新加载数据。请确保网络连接正常。
    </div>

    <div id="cacheList" class="cache-list">
      <strong>检测到的价格缓存：</strong>
      <div id="cacheItems"></div>
    </div>

    <button onclick="clearPriceCache()">清除所有价格缓存</button>

    <div id="successMessage" class="success">
      <strong>✅ 成功！</strong><br>
      所有价格数据缓存已清除。页面将在 3 秒后自动刷新...
    </div>
  </div>

  <script>
    // 检测价格相关的缓存键
    function detectPriceCaches() {
      const priceCacheKeys = [];
      const allKeys = Object.keys(localStorage);
      
      // 匹配所有价格相关的缓存键
      const pricePatterns = [
        /^price_/,
        /gold.*price/i,
        /nasdaq.*price/i,
        /astock.*price/i,
        /demo.*price/i,
        /_price$/,
        /priceData/,
        /investment-news-analyzer-state/
      ];
      
      allKeys.forEach(key => {
        if (pricePatterns.some(pattern => pattern.test(key))) {
          priceCacheKeys.push(key);
        }
      });
      
      return priceCacheKeys;
    }

    // 显示检测到的缓存
    function displayCaches() {
      const caches = detectPriceCaches();
      const container = document.getElementById('cacheItems');
      
      if (caches.length === 0) {
        container.innerHTML = '<div class="cache-item">未检测到价格缓存</div>';
      } else {
        container.innerHTML = caches.map(key => 
          `<div class="cache-item">🗂️ ${key}</div>`
        ).join('');
      }
    }

    // 清除价格缓存
    function clearPriceCache() {
      const caches = detectPriceCaches();
      let clearedCount = 0;
      
      console.log('🧹 开始清除价格缓存...');
      
      // 清除所有价格相关的缓存
      caches.forEach(key => {
        try {
          localStorage.removeItem(key);
          console.log(`✅ 已清除: ${key}`);
          clearedCount++;
        } catch (error) {
          console.error(`❌ 清除失败: ${key}`, error);
        }
      });
      
      // 特别清除应用状态中的价格数据
      try {
        const stateKey = 'investment-news-analyzer-state';
        const state = localStorage.getItem(stateKey);
        if (state) {
          const parsedState = JSON.parse(state);
          if (parsedState.priceData) {
            // 清空价格数据但保留其他状态
            parsedState.priceData = {
              gold: [],
              nasdaq: [],
              astock: []
            };
            localStorage.setItem(stateKey, JSON.stringify(parsedState));
            console.log('✅ 已清除应用状态中的价格数据');
          }
        }
      } catch (error) {
        console.error('❌ 清除应用状态失败:', error);
      }
      
      console.log(`🎉 总共清除了 ${clearedCount} 个缓存项`);
      
      // 显示成功消息
      document.getElementById('successMessage').style.display = 'block';
      
      // 3秒后刷新页面
      setTimeout(() => {
        window.location.href = '/';
      }, 3000);
    }

    // 页面加载时显示缓存
    window.onload = displayCaches;
  </script>
</body>
</html>
