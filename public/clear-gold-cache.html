<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清除黄金价格缓存</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 10px 10px 0;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        #output {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
        }
        .success {
            color: #10b981;
            font-weight: bold;
        }
        .error {
            color: #ef4444;
            font-weight: bold;
        }
        .info {
            color: #3b82f6;
        }
        .warning {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 清除黄金价格缓存</h1>
        <p class="subtitle">如果黄金价格没有更新，使用此工具清除所有缓存</p>

        <div class="warning">
            <strong>⚠️ 注意：</strong> 清除缓存后，页面会自动刷新，所有数据将重新加载。
        </div>

        <button onclick="clearAllGoldCache()">🗑️ 清除所有黄金缓存</button>
        <button onclick="clearServiceWorkerCache()">🔄 清除 Service Worker 缓存</button>
        <button onclick="unregisterServiceWorker()">❌ 注销 Service Worker</button>
        <button onclick="showAllCache()">👀 查看当前缓存</button>
        <button onclick="testGoldAPI()">🧪 测试黄金 API</button>

        <div id="output"></div>
    </div>

    <script>
        const output = document.getElementById('output');

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
            output.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            output.scrollTop = output.scrollHeight;
        }

        async function clearAllGoldCache() {
            log('🔄 开始清除所有黄金价格缓存...', 'info');
            
            try {
                // 1. 清除 localStorage
                const keysToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.includes('gold')) {
                        keysToRemove.push(key);
                    }
                }
                
                keysToRemove.forEach(key => {
                    localStorage.removeItem(key);
                    log(`✅ 已删除 localStorage: ${key}`, 'success');
                });
                
                // 2. 清除 sessionStorage
                const sessionKeysToRemove = [];
                for (let i = 0; i < sessionStorage.length; i++) {
                    const key = sessionStorage.key(i);
                    if (key && key.includes('gold')) {
                        sessionKeysToRemove.push(key);
                    }
                }
                
                sessionKeysToRemove.forEach(key => {
                    sessionStorage.removeItem(key);
                    log(`✅ 已删除 sessionStorage: ${key}`, 'success');
                });
                
                // 3. 清除 Cache Storage
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    log(`📦 找到 ${cacheNames.length} 个缓存`, 'info');
                    
                    for (const cacheName of cacheNames) {
                        const cache = await caches.open(cacheName);
                        const requests = await cache.keys();
                        
                        for (const request of requests) {
                            if (request.url.includes('gold') || request.url.includes('goldprice')) {
                                await cache.delete(request);
                                log(`✅ 已删除缓存: ${request.url}`, 'success');
                            }
                        }
                    }
                }
                
                log('✅ 所有黄金价格缓存已清除！', 'success');
                log('🔄 3秒后自动刷新页面...', 'info');
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 3000);
                
            } catch (error) {
                log(`❌ 清除缓存失败: ${error.message}`, 'error');
            }
        }

        async function clearServiceWorkerCache() {
            log('🔄 开始清除 Service Worker 缓存...', 'info');
            
            try {
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    log(`📦 找到 ${cacheNames.length} 个缓存`, 'info');
                    
                    for (const cacheName of cacheNames) {
                        await caches.delete(cacheName);
                        log(`✅ 已删除缓存: ${cacheName}`, 'success');
                    }
                    
                    log('✅ Service Worker 缓存已清除！', 'success');
                } else {
                    log('⚠️ 浏览器不支持 Cache Storage', 'error');
                }
            } catch (error) {
                log(`❌ 清除失败: ${error.message}`, 'error');
            }
        }

        async function unregisterServiceWorker() {
            log('🔄 开始注销 Service Worker...', 'info');
            
            try {
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    log(`📦 找到 ${registrations.length} 个 Service Worker`, 'info');
                    
                    for (const registration of registrations) {
                        await registration.unregister();
                        log(`✅ 已注销 Service Worker: ${registration.scope}`, 'success');
                    }
                    
                    log('✅ 所有 Service Worker 已注销！', 'success');
                    log('🔄 3秒后自动刷新页面...', 'info');
                    
                    setTimeout(() => {
                        window.location.reload();
                    }, 3000);
                } else {
                    log('⚠️ 浏览器不支持 Service Worker', 'error');
                }
            } catch (error) {
                log(`❌ 注销失败: ${error.message}`, 'error');
            }
        }

        async function showAllCache() {
            log('🔍 查看当前缓存...', 'info');
            
            try {
                // localStorage
                log('\n📦 localStorage:', 'info');
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key) {
                        const value = localStorage.getItem(key);
                        const preview = value ? value.substring(0, 100) : '';
                        log(`  ${key}: ${preview}...`, 'info');
                    }
                }
                
                // Cache Storage
                if ('caches' in window) {
                    log('\n📦 Cache Storage:', 'info');
                    const cacheNames = await caches.keys();
                    
                    for (const cacheName of cacheNames) {
                        log(`  缓存名称: ${cacheName}`, 'info');
                        const cache = await caches.open(cacheName);
                        const requests = await cache.keys();
                        log(`    包含 ${requests.length} 个请求`, 'info');
                        
                        requests.forEach(request => {
                            if (request.url.includes('gold') || request.url.includes('goldprice')) {
                                log(`    - ${request.url}`, 'info');
                            }
                        });
                    }
                }
                
                log('\n✅ 缓存查看完成', 'success');
            } catch (error) {
                log(`❌ 查看失败: ${error.message}`, 'error');
            }
        }

        async function testGoldAPI() {
            log('🧪 测试黄金价格 API...', 'info');
            
            try {
                const timestamp = Date.now();
                const url = `/.netlify/functions/goldprice-proxy?symbol=gold&range=5d&_t=${timestamp}`;
                log(`📡 请求: ${url}`, 'info');
                
                const response = await fetch(url, {
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                });
                
                log(`📡 响应状态: ${response.status} ${response.statusText}`, 'info');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                log('\n📊 API 响应数据:', 'info');
                log(JSON.stringify(data, null, 2), 'info');
                
                if (data.meta && data.meta.currentPrice) {
                    log(`\n💰 当前黄金价格: ${data.meta.currentPrice} USD/oz`, 'success');
                    log(`📅 昨日收盘: ${data.meta.previousClose} USD/oz`, 'info');
                    log(`📈 涨跌: ${data.meta.change} (${data.meta.changePercent}%)`, 'info');
                    log(`🔗 数据源: ${data.meta.source}`, 'info');
                }
                
                log('\n✅ API 测试成功！', 'success');
            } catch (error) {
                log(`❌ API 测试失败: ${error.message}`, 'error');
            }
        }

        // 页面加载时显示欢迎信息
        log('👋 欢迎使用黄金价格缓存清理工具', 'success');
        log('💡 如果黄金价格没有更新，请点击"清除所有黄金缓存"按钮', 'info');
    </script>
</body>
</html>
