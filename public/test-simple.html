<!DOCTYPE html>
<html>
<head>
    <title>简单测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { margin: 10px; padding: 10px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>API测试页面</h1>
    
    <button onclick="testNews()">测试新闻API</button>
    <button onclick="testPrice()">测试价格API</button>
    <button onclick="testTranslate()">测试翻译API</button>
    <button onclick="testEnv()">调试环境变量</button>
    
    <div id="output"></div>
    
    <script>
        function log(message) {
            const div = document.createElement('div');
            div.className = 'result';
            div.innerHTML = message;
            document.getElementById('output').appendChild(div);
        }
        
        async function testNews() {
            log('🔄 测试新闻API...');
            try {
                const response = await fetch('/.netlify/functions/news-proxy?q=apple&pageSize=3');
                const data = await response.json();
                log(`✅ 新闻API: 状态=${response.status}, 结果=${data.totalResults}, 文章=${data.articles?.length}`);
            } catch (error) {
                log(`❌ 新闻API失败: ${error.message}`);
            }
        }
        
        async function testPrice() {
            log('🔄 测试价格API...');
            try {
                const response = await fetch('/.netlify/functions/price-proxy?function=GLOBAL_QUOTE&symbol=QQQ');
                const data = await response.json();
                
                if (data.error) {
                    log(`❌ 价格API错误: ${data.error}`);
                    if (data.debug) {
                        log(`🔍 调试信息: ${JSON.stringify(data.debug)}`);
                    }
                } else {
                    const price = data['Global Quote']?.['05. price'];
                    log(`✅ 价格API: 状态=${response.status}, QQQ价格=${price || '无'}`);
                }
            } catch (error) {
                log(`❌ 价格API失败: ${error.message}`);
            }
        }
        
        async function testTranslate() {
            log('🔄 测试翻译API...');
            try {
                const response = await fetch('/.netlify/functions/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: 'Apple Inc. reported strong quarterly earnings.' })
                });
                const data = await response.json();
                
                if (data.error) {
                    log(`❌ 翻译API错误: ${data.error}`);
                } else {
                    log(`✅ 翻译API: 状态=${response.status}`);
                    log(`📝 原文: Apple Inc. reported strong quarterly earnings.`);
                    log(`🌐 译文: ${data.translatedText || '翻译失败'}`);
                }
            } catch (error) {
                log(`❌ 翻译API失败: ${error.message}`);
            }
        }
        
        async function testEnv() {
            log('🔄 调试环境变量...');
            try {
                const response = await fetch('/.netlify/functions/debug-env');
                const data = await response.json();
                log(`✅ 环境变量调试: 状态=${response.status}`);
                log(`🔑 Alpha Vantage密钥存在: ${data.envVars?.ALPHA_VANTAGE_API_KEY?.exists || false}`);
                log(`🔑 Gemini密钥存在: ${data.envVars?.GEMINI_API_KEY?.exists || false}`);
            } catch (error) {
                log(`❌ 环境变量调试失败: ${error.message}`);
            }
        }
        
        // 页面加载时自动测试
        window.onload = function() {
            log('📱 页面加载完成，开始测试...');
            testEnv();
            setTimeout(testNews, 1000);
            setTimeout(testPrice, 2000);
            setTimeout(testTranslate, 3000);
        };
    </script>
</body>
</html>
