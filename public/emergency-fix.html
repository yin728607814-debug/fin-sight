<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紧急修复 - 清除所有缓存</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #ef4444;
            font-size: 32px;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .warning {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .warning strong {
            color: #f59e0b;
            display: block;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .big-button {
            width: 100%;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin: 15px 0;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }
        .big-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
        }
        .big-button:active {
            transform: translateY(0);
        }
        .secondary-button {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .secondary-button:hover {
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }
        #output {
            margin-top: 30px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success { color: #10b981; font-weight: bold; }
        .error { color: #ef4444; font-weight: bold; }
        .info { color: #3b82f6; }
        .step {
            background: #f3f4f6;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .step-number {
            display: inline-block;
            width: 30px;
            height: 30px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            margin-right: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 紧急修复工具</h1>
        <p class="subtitle">解决页面加载错误和缓存问题</p>

        <div class="warning">
            <strong>⚠️ 当前问题：</strong>
            Service Worker 缓存了旧的 JavaScript 文件，导致页面无法正常加载。
            <br><br>
            <strong>解决方法：</strong>
            点击下面的按钮清除所有缓存并注销 Service Worker。
        </div>

        <button class="big-button" onclick="emergencyFix()">
            🔥 一键修复所有问题
        </button>

        <button class="big-button secondary-button" onclick="manualSteps()">
            📋 显示手动修复步骤
        </button>

        <div id="output"></div>
    </div>

    <script>
        const output = document.getElementById('output');

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
            output.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            output.scrollTop = output.scrollHeight;
        }

        async function emergencyFix() {
            output.innerHTML = '';
            log('🚀 开始紧急修复...', 'info');
            
            try {
                // 1. 注销所有 Service Worker
                log('\n步骤 1: 注销 Service Worker', 'info');
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    log(`找到 ${registrations.length} 个 Service Worker`, 'info');
                    
                    for (const registration of registrations) {
                        await registration.unregister();
                        log(`✅ 已注销: ${registration.scope}`, 'success');
                    }
                } else {
                    log('⚠️ 浏览器不支持 Service Worker', 'error');
                }
                
                // 2. 清除所有 Cache Storage
                log('\n步骤 2: 清除 Cache Storage', 'info');
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    log(`找到 ${cacheNames.length} 个缓存`, 'info');
                    
                    for (const cacheName of cacheNames) {
                        await caches.delete(cacheName);
                        log(`✅ 已删除: ${cacheName}`, 'success');
                    }
                } else {
                    log('⚠️ 浏览器不支持 Cache Storage', 'error');
                }
                
                // 3. 清除 localStorage
                log('\n步骤 3: 清除 localStorage', 'info');
                const localStorageCount = localStorage.length;
                localStorage.clear();
                log(`✅ 已清除 ${localStorageCount} 个 localStorage 项`, 'success');
                
                // 4. 清除 sessionStorage
                log('\n步骤 4: 清除 sessionStorage', 'info');
                const sessionStorageCount = sessionStorage.length;
                sessionStorage.clear();
                log(`✅ 已清除 ${sessionStorageCount} 个 sessionStorage 项`, 'success');
                
                // 5. 清除 IndexedDB
                log('\n步骤 5: 清除 IndexedDB', 'info');
                if ('indexedDB' in window) {
                    const databases = await indexedDB.databases();
                    for (const db of databases) {
                        if (db.name) {
                            indexedDB.deleteDatabase(db.name);
                            log(`✅ 已删除数据库: ${db.name}`, 'success');
                        }
                    }
                }
                
                log('\n✅ 所有修复步骤完成！', 'success');
                log('\n🔄 3秒后自动跳转到首页...', 'info');
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 3000);
                
            } catch (error) {
                log(`\n❌ 修复失败: ${error.message}`, 'error');
                log('\n请尝试手动修复步骤', 'info');
            }
        }

        function manualSteps() {
            output.innerHTML = `
<div class="step">
    <span class="step-number">1</span>
    <strong>打开开发者工具</strong>
    <br>按 F12 或 Ctrl+Shift+I (Mac: Cmd+Option+I)
</div>

<div class="step">
    <span class="step-number">2</span>
    <strong>切换到 Application 标签</strong>
    <br>在开发者工具顶部找到 "Application" 标签
</div>

<div class="step">
    <span class="step-number">3</span>
    <strong>清除 Service Workers</strong>
    <br>左侧菜单 → Service Workers → 点击 "Unregister"
</div>

<div class="step">
    <span class="step-number">4</span>
    <strong>清除 Cache Storage</strong>
    <br>左侧菜单 → Cache Storage → 右键每个缓存 → Delete
</div>

<div class="step">
    <span class="step-number">5</span>
    <strong>清除 Storage</strong>
    <br>左侧菜单 → Storage → 点击 "Clear site data"
</div>

<div class="step">
    <span class="step-number">6</span>
    <strong>硬刷新页面</strong>
    <br>按 Ctrl+Shift+R (Mac: Cmd+Shift+R)
</div>
            `;
        }

        // 页面加载时显示欢迎信息
        log('👋 欢迎使用紧急修复工具', 'success');
        log('💡 点击"一键修复所有问题"按钮开始修复', 'info');
    </script>
</body>
</html>
