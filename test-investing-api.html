<!DOCTYPE html>
<html>
<head>
    <title>测试Investing.com黄金价格API</title>
</head>
<body>
    <h1>测试Investing.com黄金价格数据</h1>
    <div id="results"></div>
    
    <script>
        async function testInvestingAPI() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>正在测试...</p>';
            
            try {
                // 测试直接访问Investing.com API
                console.log('测试1: 直接访问Investing.com API');
                
                // 尝试几个不同的API端点
                const endpoints = [
                    'https://api.investing.com/api/financialdata/historical/68',
                    'https://cn.investing.com/instruments/HistoricalDataAjax',
                    'https://tvc4.investing.com/68/1/1/1/history?symbol=68&resolution=D&from=1703030400&to=1703635200'
                ];
                
                let results = '<h2>API测试结果:</h2>';
                
                for (let i = 0; i < endpoints.length; i++) {
                    const url = endpoints[i];
                    results += `<h3>测试端点 ${i + 1}: ${url}</h3>`;
                    
                    try {
                        const response = await fetch(url, {
                            method: 'GET',
                            headers: {
                                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                                'Accept': 'application/json, text/plain, */*',
                                'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
                                'Referer': 'https://cn.investing.com/',
                                'Origin': 'https://cn.investing.com'
                            }
                        });
                        
                        results += `<p>状态码: ${response.status}</p>`;
                        results += `<p>Content-Type: ${response.headers.get('content-type')}</p>`;
                        
                        const text = await response.text();
                        results += `<p>响应长度: ${text.length} 字符</p>`;
                        results += `<p>响应预览: ${text.substring(0, 200)}...</p>`;
                        
                        // 尝试解析JSON
                        try {
                            const json = JSON.parse(text);
                            results += `<p>✅ JSON解析成功</p>`;
                            results += `<pre>${JSON.stringify(json, null, 2).substring(0, 500)}...</pre>`;
                        } catch (e) {
                            results += `<p>❌ JSON解析失败: ${e.message}</p>`;
                            if (text.includes('html')) {
                                results += `<p>⚠️ 返回的是HTML页面，不是API数据</p>`;
                            }
                        }
                        
                    } catch (error) {
                        results += `<p>❌ 请求失败: ${error.message}</p>`;
                    }
                    
                    results += '<hr>';
                }
                
                // 测试我们的Netlify代理（如果部署了）
                results += '<h3>测试Netlify代理:</h3>';
                try {
                    const proxyResponse = await fetch('/.netlify/functions/investing-proxy?symbol=gold');
                    results += `<p>代理状态码: ${proxyResponse.status}</p>`;
                    
                    const proxyData = await proxyResponse.json();
                    results += `<p>✅ 代理响应成功</p>`;
                    results += `<pre>${JSON.stringify(proxyData, null, 2)}</pre>`;
                } catch (error) {
                    results += `<p>❌ 代理测试失败: ${error.message}</p>`;
                    results += `<p>这可能是因为还没有部署到Netlify</p>`;
                }
                
                resultsDiv.innerHTML = results;
                
            } catch (error) {
                resultsDiv.innerHTML = `<p>测试失败: ${error.message}</p>`;
                console.error('API测试失败:', error);
            }
        }
        
        // 页面加载后自动测试
        testInvestingAPI();
    </script>
</body>
</html>
