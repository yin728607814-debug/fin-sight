<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试 API 队列修复</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .log-container {
            margin-top: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 600px;
            overflow-y: auto;
        }
        .log-entry {
            margin: 4px 0;
            padding: 4px 0;
        }
        .log-info { color: #4EC9B0; }
        .log-success { color: #4CAF50; }
        .log-error { color: #f44336; }
        .log-warning { color: #ff9800; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #4CAF50;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 API 队列机制测试</h1>
        <p class="subtitle">测试修复后的请求队列和速率限制功能</p>
        
        <div>
            <button id="testBtn" onclick="runTest()">开始测试</button>
            <button onclick="clearLogs()">清空日志</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">总请求数</div>
                <div class="stat-value" id="totalRequests">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">成功</div>
                <div class="stat-value" id="successCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">失败</div>
                <div class="stat-value" id="failCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">总耗时</div>
                <div class="stat-value" id="totalTime">0s</div>
            </div>
        </div>

        <div class="log-container" id="logContainer"></div>
    </div>

    <script type="module">
        import { analysisService } from './services/analysisService.ts';

        let totalRequests = 0;
        let successCount = 0;
        let failCount = 0;
        let startTime = 0;

        window.runTest = async function() {
            const btn = document.getElementById('testBtn');
            btn.disabled = true;
            btn.textContent = '测试中...';
            
            // 重置统计
            totalRequests = 0;
            successCount = 0;
            failCount = 0;
            startTime = Date.now();
            
            clearLogs();
            log('🚀 开始测试 - 同时发起 5 个分析请求', 'info');
            log('📊 验证：1) 请求串行执行  2) 请求间隔控制  3) 错误不阻塞队列', 'info');
            log('', 'info');

            const testNews = [
                'Gold prices surge as inflation concerns mount worldwide',
                'Tech stocks rally on strong earnings reports from major companies',
                'Dollar weakens amid global economic uncertainty and policy shifts',
                'Central banks coordinate policy response to market volatility',
                'Oil prices fluctuate on supply concerns and demand forecasts'
            ];

            totalRequests = testNews.length;
            updateStats();

            // 同时发起多个请求
            const promises = testNews.map((news, index) => {
                const requestTime = Date.now();
                log(`📤 请求 ${index + 1}: ${news.substring(0, 50)}...`, 'info');
                
                return analysisService.analyzeNewsImpact(news, index % 2 === 0 ? 'gold' : 'nasdaq')
                    .then(result => {
                        const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
                        const duration = ((Date.now() - requestTime) / 1000).toFixed(2);
                        log(`✅ 请求 ${index + 1} 完成 (${elapsed}s, 耗时${duration}s): ${result.impact} (置信度: ${result.confidence.toFixed(2)})`, 'success');
                        successCount++;
                        updateStats();
                        return { index: index + 1, success: true, elapsed };
                    })
                    .catch(error => {
                        const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
                        log(`❌ 请求 ${index + 1} 失败 (${elapsed}s): ${error.message}`, 'error');
                        failCount++;
                        updateStats();
                        return { index: index + 1, success: false, elapsed };
                    });
            });

            // 等待所有请求完成
            const results = await Promise.all(promises);
            
            const totalTime = ((Date.now() - startTime) / 1000).toFixed(2);
            
            log('', 'info');
            log('📈 测试完成！', 'success');
            log(`总耗时: ${totalTime}秒`, 'info');
            log(`成功: ${successCount}/${totalRequests}`, 'success');
            log(`失败: ${failCount}/${totalRequests}`, failCount > 0 ? 'error' : 'info');
            
            // 分析请求间隔
            log('', 'info');
            log('⏱️  请求时间分析:', 'info');
            results.forEach((r, i) => {
                if (i > 0) {
                    const prevElapsed = parseFloat(results[i - 1].elapsed);
                    const currElapsed = parseFloat(r.elapsed);
                    const interval = (currElapsed - prevElapsed).toFixed(2);
                    const status = parseFloat(interval) >= 3.5 ? '✅' : '⚠️';
                    log(`${status} 请求 ${r.index} 与前一个请求间隔: ${interval}秒`, 'info');
                }
            });

            // 检查缓存
            const cacheStats = analysisService.getCacheStats();
            log('', 'info');
            log(`💾 缓存统计: ${cacheStats.size} 个条目`, 'info');
            
            btn.disabled = false;
            btn.textContent = '重新测试';
        };

        window.clearLogs = function() {
            document.getElementById('logContainer').innerHTML = '';
        };

        function log(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function updateStats() {
            document.getElementById('totalRequests').textContent = totalRequests;
            document.getElementById('successCount').textContent = successCount;
            document.getElementById('failCount').textContent = failCount;
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
            document.getElementById('totalTime').textContent = elapsed + 's';
        }

        // 页面加载完成后的提示
        log('✨ 测试页面已就绪', 'success');
        log('点击"开始测试"按钮来验证 API 队列机制', 'info');
    </script>
</body>
</html>
