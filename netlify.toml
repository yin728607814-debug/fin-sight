[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co https://generativelanguage.googleapis.com https://query2.finance.yahoo.com https://api.exchangerate-api.com https://api.frankfurter.app; img-src 'self' data: https:; frame-ancestors 'none';"

[build.environment]
  NODE_VERSION = "20"

# 定时任务配置
# 每天凌晨 2:00 (北京时间) = 18:00 (UTC) 执行定投
[[functions]]
  name = "auto-invest-cron"
  schedule = "0 18 * * *"