<!DOCTYPE html>
<html>
<head>
    <title>测试本地黄金价格函数</title>
</head>
<body>
    <h1>测试黄金价格函数</h1>
    <div id="results">正在测试...</div>
    
    <script>
        async function testLocalFunction() {
            const resultsDiv = document.getElementById('results');
            
            try {
                // 测试部署的函数
                console.log('测试部署的investing-proxy函数');
                const response = await fetch('/.netlify/functions/investing-proxy?symbol=gold');
                
                console.log('响应状态:', response.status);
                console.log('响应头:', response.headers);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('响应数据:', data);
                    
                    if (data.priceData && data.priceData.length > 0) {
                        const latest = data.priceData[data.priceData.length - 1];
                        resultsDiv.innerHTML = `
                            <h2>✅ 成功获取黄金价格数据</h2>
                            <p><strong>最新价格:</strong> ${latest.close} USD/oz</p>
                            <p><strong>日期:</strong> ${latest.date}</p>
                            <p><strong>数据源:</strong> ${data.meta.source}</p>
                            <p><strong>数据点数量:</strong> ${data.priceData.length}</p>
                            <h3>5天历史数据:</h3>
                            <table border="1" style="border-collapse: collapse; width: 100%;">
                                <tr>
                                    <th>日期</th>
                                    <th>开盘</th>
                                    <th>最高</th>
                                    <th>最低</th>
                                    <th>收盘</th>
                                    <th>变化</th>
                                </tr>
                                ${data.priceData.map(item => `
                                    <tr>
                                        <td>${item.date}</td>
                                        <td>${item.open}</td>
                                        <td>${item.high}</td>
                                        <td>${item.low}</td>
                                        <td>${item.close}</td>
                                        <td style="color: ${item.changePercent >= 0 ? 'green' : 'red'}">
                                            ${item.changePercent >= 0 ? '+' : ''}${item.changePercent.toFixed(2)}%
                                        </td>
                                    </tr>
                                `).join('')}
                            </table>
                        `;
                    } else {
                        resultsDiv.innerHTML = '<h2>❌ 数据格式错误</h2><pre>' + JSON.stringify(data, null, 2) + '</pre>';
                    }
                } else {
                    const errorText = await response.text();
                    resultsDiv.innerHTML = `
                        <h2>❌ 请求失败</h2>
                        <p>状态码: ${response.status}</p>
                        <p>错误信息: ${errorText}</p>
                    `;
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `
                    <h2>❌ 测试失败</h2>
                    <p>错误: ${error.message}</p>
                `;
                console.error('测试失败:', error);
            }
        }
        
        // 页面加载后自动测试
        testLocalFunction();
    </script>
</body>
</html>
