<!DOCTYPE html>
<html>
<head>
    <title>测试黄金价格API</title>
</head>
<body>
    <h1>测试黄金价格数据源</h1>
    <div id="results"></div>
    
    <script>
        async function testGoldAPI() {
            const resultsDiv = document.getElementById('results');
            
            try {
                // 测试XAUUSD=X符号
                const response = await fetch('https://query2.finance.yahoo.com/v8/finance/chart/XAUUSD=X?range=5d&interval=1d');
                const data = await response.json();
                
                console.log('Yahoo Finance API响应:', data);
                
                if (data.chart && data.chart.result && data.chart.result[0]) {
                    const result = data.chart.result[0];
                    const quotes = result.indicators.quote[0];
                    const latestClose = quotes.close[quotes.close.length - 1];
                    
                    resultsDiv.innerHTML = `
                        <h2>XAUUSD=X 数据:</h2>
                        <p>最新收盘价: ${latestClose}</p>
                        <p>货币: ${result.meta.currency}</p>
                        <p>交易所: ${result.meta.exchangeName}</p>
                        <p>数据点数量: ${quotes.close.length}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultsDiv.innerHTML = '<p>无法获取数据</p>';
                }
            } catch (error) {
                resultsDiv.innerHTML = `<p>错误: ${error.message}</p>`;
                console.error('API测试失败:', error);
            }
        }
        
        // 页面加载后自动测试
        testGoldAPI();
    </script>
</body>
</html>
