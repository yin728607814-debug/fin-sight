<!DOCTYPE html>
<html>
<head>
    <title>测试Investing.com黄金价格获取</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body>
    <h1>测试从Investing.com获取黄金价格</h1>
    <div id="results">正在测试...</div>
    
    <script>
        async function testInvestingGoldPrice() {
            const resultsDiv = document.getElementById('results');
            
            try {
                console.log('🌐 测试Investing.com黄金价格获取...');
                
                // 测试我们的Netlify函数
                const response = await axios.get('/.netlify/functions/investing-proxy', {
                    params: { 
                        symbol: 'gold',
                        range: '5d'
                    },
                    timeout: 30000
                });
                
                console.log('✅ API响应成功:', response.data);
                
                const data = response.data;
                let resultHtml = '<h2>✅ 成功获取黄金价格数据</h2>';
                
                if (data.priceData && data.priceData.length > 0) {
                    const latestPrice = data.priceData[data.priceData.length - 1];
                    
                    resultHtml += `<div style="background: #f0f8ff; padding: 20px; border-radius: 8px; margin: 20px 0;">`;
                    resultHtml += `<h3>📊 最新价格信息</h3>`;
                    resultHtml += `<p><strong>当前价格:</strong> <span style="color: #2563eb; font-size: 24px; font-weight: bold;">$${latestPrice.close.toLocaleString()}</span> USD/oz</p>`;
                    resultHtml += `<p><strong>日期:</strong> ${latestPrice.date}</p>`;
                    resultHtml += `<p><strong>开盘价:</strong> $${latestPrice.open.toFixed(2)}</p>`;
                    resultHtml += `<p><strong>最高价:</strong> $${latestPrice.high.toFixed(2)}</p>`;
                    resultHtml += `<p><strong>最低价:</strong> $${latestPrice.low.toFixed(2)}</p>`;
                    resultHtml += `<p><strong>变化:</strong> <span style="color: ${latestPrice.changePercent >= 0 ? 'green' : 'red'};">${latestPrice.changePercent >= 0 ? '+' : ''}${latestPrice.changePercent.toFixed(2)}%</span></p>`;
                    resultHtml += `</div>`;
                    
                    // 检查价格是否在合理范围内
                    if (latestPrice.close >= 4000 && latestPrice.close <= 5000) {
                        resultHtml += `<div style="background: #dcfce7; padding: 15px; border-radius: 8px; color: #166534;">`;
                        resultHtml += `<h4>🎯 价格验证通过</h4>`;
                        resultHtml += `<p>价格 $${latestPrice.close.toFixed(2)} 在预期范围内 (4000-5000 USD/oz)</p>`;
                        resultHtml += `</div>`;
                    } else {
                        resultHtml += `<div style="background: #fef2f2; padding: 15px; border-radius: 8px; color: #dc2626;">`;
                        resultHtml += `<h4>⚠️ 价格可能不准确</h4>`;
                        resultHtml += `<p>价格 $${latestPrice.close.toFixed(2)} 不在预期范围内 (4000-5000 USD/oz)</p>`;
                        resultHtml += `</div>`;
                    }
                    
                    // 显示历史数据
                    resultHtml += `<h3>📈 5天历史数据</h3>`;
                    resultHtml += `<table style="width: 100%; border-collapse: collapse; margin: 10px 0;">`;
                    resultHtml += `<tr style="background: #f8fafc; font-weight: bold;">`;
                    resultHtml += `<th style="border: 1px solid #e2e8f0; padding: 8px;">日期</th>`;
                    resultHtml += `<th style="border: 1px solid #e2e8f0; padding: 8px;">收盘价</th>`;
                    resultHtml += `<th style="border: 1px solid #e2e8f0; padding: 8px;">变化</th>`;
                    resultHtml += `<th style="border: 1px solid #e2e8f0; padding: 8px;">涨跌幅</th>`;
                    resultHtml += `</tr>`;
                    
                    data.priceData.forEach(item => {
                        const changeColor = item.changePercent >= 0 ? 'green' : 'red';
                        resultHtml += `<tr>`;
                        resultHtml += `<td style="border: 1px solid #e2e8f0; padding: 8px;">${item.date}</td>`;
                        resultHtml += `<td style="border: 1px solid #e2e8f0; padding: 8px;">$${item.close.toFixed(2)}</td>`;
                        resultHtml += `<td style="border: 1px solid #e2e8f0; padding: 8px; color: ${changeColor};">${item.change >= 0 ? '+' : ''}${item.change.toFixed(2)}</td>`;
                        resultHtml += `<td style="border: 1px solid #e2e8f0; padding: 8px; color: ${changeColor};">${item.changePercent >= 0 ? '+' : ''}${item.changePercent.toFixed(2)}%</td>`;
                        resultHtml += `</tr>`;
                    });
                    resultHtml += `</table>`;
                } else {
                    resultHtml += `<div style="background: #fef2f2; padding: 15px; border-radius: 8px; color: #dc2626;">`;
                    resultHtml += `<h4>❌ 没有价格数据</h4>`;
                    resultHtml += `<p>API返回了响应，但没有包含价格数据</p>`;
                    resultHtml += `</div>`;
                }
                
                // 显示原始响应数据
                resultHtml += `<details style="margin-top: 20px;">`;
                resultHtml += `<summary style="cursor: pointer; font-weight: bold;">查看原始API响应</summary>`;
                resultHtml += `<pre style="background: #f8fafc; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 12px;">${JSON.stringify(data, null, 2)}</pre>`;
                resultHtml += `</details>`;
                
                resultsDiv.innerHTML = resultHtml;
                
            } catch (error) {
                console.error('❌ 测试失败:', error);
                
                let errorHtml = '<h2>❌ 测试失败</h2>';
                errorHtml += `<div style="background: #fef2f2; padding: 15px; border-radius: 8px; color: #dc2626;">`;
                errorHtml += `<p><strong>错误信息:</strong> ${error.message}</p>`;
                
                if (error.response) {
                    errorHtml += `<p><strong>状态码:</strong> ${error.response.status}</p>`;
                    errorHtml += `<p><strong>响应数据:</strong></p>`;
                    errorHtml += `<pre style="background: #f8fafc; padding: 10px; border-radius: 4px; font-size: 12px;">${JSON.stringify(error.response.data, null, 2)}</pre>`;
                }
                
                errorHtml += `</div>`;
                
                // 提供故障排除建议
                errorHtml += `<div style="background: #fffbeb; padding: 15px; border-radius: 8px; color: #92400e; margin-top: 15px;">`;
                errorHtml += `<h4>🔧 故障排除建议</h4>`;
                errorHtml += `<ul>`;
                errorHtml += `<li>确保已部署到Netlify并且函数正常工作</li>`;
                errorHtml += `<li>检查网络连接</li>`;
                errorHtml += `<li>查看浏览器控制台的详细错误信息</li>`;
                errorHtml += `<li>如果是本地测试，可能需要先部署到Netlify</li>`;
                errorHtml += `</ul>`;
                errorHtml += `</div>`;
                
                resultsDiv.innerHTML = errorHtml;
            }
        }
        
        // 页面加载后自动测试
        testInvestingGoldPrice();
        
        // 添加手动重试按钮
        setTimeout(() => {
            const retryButton = document.createElement('button');
            retryButton.textContent = '🔄 重新测试';
            retryButton.style.cssText = 'margin: 20px 0; padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px;';
            retryButton.onclick = testInvestingGoldPrice;
            document.body.appendChild(retryButton);
        }, 2000);
    </script>
</body>
</html>
</content>
