<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试混合新闻源策略</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            border-bottom: 3px solid #4CAF50;
            padding-bottom: 10px;
        }
        .test-section {
            margin: 30px 0;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 6px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #4CAF50;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }
        .news-item {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
            border-left: 4px solid #2196F3;
        }
        .news-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        .news-meta {
            font-size: 12px;
            color: #666;
            margin: 5px 0;
        }
        .news-content {
            font-size: 14px;
            color: #555;
            margin-top: 10px;
            line-height: 1.6;
        }
        .score {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .score-high { background: #4CAF50; color: white; }
        .score-medium { background: #FF9800; color: white; }
        .score-low { background: #f44336; color: white; }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }
        .check-list {
            list-style: none;
            padding: 0;
        }
        .check-list li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .check-list li:before {
            content: '✓ ';
            color: #4CAF50;
            font-weight: bold;
            margin-right: 8px;
        }
        .check-list li.failed:before {
            content: '✗ ';
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 混合新闻源策略测试</h1>
        
        <div class="test-section">
            <h2>测试说明</h2>
            <p>此测试将验证混合新闻源策略的效果：</p>
            <ul>
                <li>✅ 新浪财经美股频道（中文）</li>
                <li>✅ 东方财富美股频道（中文）</li>
                <li>✅ Finnhub备用源（英文+翻译）</li>
            </ul>
            <p><strong>目标：</strong>获取50条高相关性的纳斯达克新闻</p>
        </div>

        <div>
            <button id="testBtn" onclick="runTest()">开始测试</button>
            <button onclick="location.reload()">重置</button>
        </div>

        <div id="results"></div>
    </div>

    <script type="module">
        import { NewsService } from './services/newsService';

        window.runTest = async function() {
            const btn = document.getElementById('testBtn');
            const results = document.getElementById('results');
            
            btn.disabled = true;
            results.innerHTML = '<div class="loading">⏳ 正在获取新闻...</div>';
            
            try {
                const newsService = new NewsService();
                const startTime = Date.now();
                
                const news = await newsService.fetchMarketNews('nasdaq', 50);
                
                const duration = Date.now() - startTime;
                
                // 统计数据
                const sourceStats = {};
                news.forEach(item => {
                    sourceStats[item.source] = (sourceStats[item.source] || 0) + 1;
                });
                
                const scores = news.map(n => n.relevanceScore);
                const avgScore = scores.reduce((a, b) => a + b, 0) / scores.length;
                const highRelevance = news.filter(n => n.relevanceScore >= 0.6).length;
                const mediumRelevance = news.filter(n => n.relevanceScore >= 0.4 && n.relevanceScore < 0.6).length;
                
                // 关键词统计
                const nasdaqCount = news.filter(n => {
                    const text = (n.title + ' ' + n.content).toLowerCase();
                    return text.includes('纳斯达克') || text.includes('nasdaq') || text.includes('纳指');
                }).length;
                
                // 生成结果HTML
                let html = `
                    <div class="success">
                        ✅ 测试完成！耗时: ${duration}ms
                    </div>
                    
                    <div class="test-section">
                        <h2>📊 统计数据</h2>
                        <div class="stats">
                            <div class="stat-card">
                                <div class="stat-label">新闻总数</div>
                                <div class="stat-value">${news.length}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">平均相关性</div>
                                <div class="stat-value">${(avgScore * 100).toFixed(1)}分</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">高相关性</div>
                                <div class="stat-value">${highRelevance}条</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">纳斯达克关键词</div>
                                <div class="stat-value">${nasdaqCount}条</div>
                            </div>
                        </div>
                        
                        <h3>来源分布</h3>
                        <ul>
                            ${Object.entries(sourceStats).map(([source, count]) => 
                                `<li>${source}: ${count}条</li>`
                            ).join('')}
                        </ul>
                    </div>
                    
                    <div class="test-section">
                        <h2>✅ 测试结果</h2>
                        <ul class="check-list">
                            <li class="${news.length >= 50 ? '' : 'failed'}">
                                新闻数量: ${news.length}/50
                            </li>
                            <li class="${avgScore >= 0.5 ? '' : 'failed'}">
                                平均相关性: ${(avgScore * 100).toFixed(1)}分 (目标≥50分)
                            </li>
                            <li class="${highRelevance >= 15 ? '' : 'failed'}">
                                高相关性占比: ${(highRelevance/news.length*100).toFixed(1)}% (目标≥30%)
                            </li>
                            <li class="${Object.keys(sourceStats).length >= 2 ? '' : 'failed'}">
                                来源多样性: ${Object.keys(sourceStats).length}个来源 (目标≥2)
                            </li>
                            <li class="${nasdaqCount >= 10 ? '' : 'failed'}">
                                纳斯达克关键词: ${nasdaqCount}条 (目标≥10)
                            </li>
                        </ul>
                    </div>
                    
                    <div class="test-section">
                        <h2>📰 新闻预览（前10条）</h2>
                        ${news.slice(0, 10).map((item, index) => {
                            const scoreClass = item.relevanceScore >= 0.6 ? 'score-high' : 
                                             item.relevanceScore >= 0.4 ? 'score-medium' : 'score-low';
                            return `
                                <div class="news-item">
                                    <div class="news-title">${index + 1}. ${item.title}</div>
                                    <div class="news-meta">
                                        来源: ${item.source} | 
                                        相关性: <span class="score ${scoreClass}">${(item.relevanceScore * 100).toFixed(1)}分</span>
                                    </div>
                                    <div class="news-content">${item.content.substring(0, 150)}...</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                
                results.innerHTML = html;
                
            } catch (error) {
                results.innerHTML = `
                    <div class="error">
                        ❌ 测试失败: ${error.message}
                    </div>
                `;
                console.error('测试错误:', error);
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
