<!DOCTYPE html>
<html>
<head>
    <title>测试黄金价格修复</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body>
    <h1>测试黄金价格修复 - 应该显示4400+ USD/oz</h1>
    <div id="results">正在测试...</div>
    
    <script>
        async function testGoldPriceFix() {
            const resultsDiv = document.getElementById('results');
            
            try {
                // 测试访问黄金页面
                console.log('测试访问黄金页面...');
                
                // 直接访问黄金页面
                const response = await fetch('/gold');
                const html = await response.text();
                
                console.log('页面响应状态:', response.status);
                
                if (response.ok) {
                    // 查找价格相关的内容
                    const priceMatches = html.match(/([0-9,]+\.?[0-9]*)\s*(USD|美元)/gi);
                    const goldPriceMatches = html.match(/(4[0-9]{3}\.?[0-9]*)/g);
                    
                    let resultHtml = '<h2>✅ 成功访问黄金页面</h2>';
                    
                    if (goldPriceMatches && goldPriceMatches.length > 0) {
                        resultHtml += '<h3>🎯 找到4000+价格:</h3><ul>';
                        goldPriceMatches.forEach(price => {
                            resultHtml += `<li style="color: green; font-weight: bold;">${price}</li>`;
                        });
                        resultHtml += '</ul>';
                    }
                    
                    if (priceMatches && priceMatches.length > 0) {
                        resultHtml += '<h3>💰 所有价格匹配:</h3><ul>';
                        priceMatches.forEach(price => {
                            const isCorrect = price.includes('4') && (price.includes('400') || price.includes('4,4'));
                            resultHtml += `<li style="color: ${isCorrect ? 'green' : 'red'};">${price}</li>`;
                        });
                        resultHtml += '</ul>';
                    }
                    
                    // 检查是否还有错误的2595价格
                    const wrongPrices = html.match(/(2[0-9]{3}\.?[0-9]*)/g);
                    if (wrongPrices && wrongPrices.length > 0) {
                        resultHtml += '<h3>❌ 发现错误价格 (应该修复):</h3><ul>';
                        wrongPrices.forEach(price => {
                            resultHtml += `<li style="color: red; font-weight: bold;">${price}</li>`;
                        });
                        resultHtml += '</ul>';
                    } else {
                        resultHtml += '<h3>✅ 没有发现错误的2000+价格</h3>';
                    }
                    
                    // 显示页面标题
                    const titleMatch = html.match(/<title[^>]*>([^<]+)<\/title>/i);
                    if (titleMatch) {
                        resultHtml += `<p><strong>页面标题:</strong> ${titleMatch[1]}</p>`;
                    }
                    
                    resultsDiv.innerHTML = resultHtml;
                } else {
                    resultsDiv.innerHTML = `
                        <h2>❌ 访问失败</h2>
                        <p>状态码: ${response.status}</p>
                    `;
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `
                    <h2>❌ 测试失败</h2>
                    <p>错误: ${error.message}</p>
                `;
                console.error('测试失败:', error);
            }
        }
        
        // 页面加载后自动测试
        testGoldPriceFix();
        
        // 每10秒重新测试一次
        setInterval(testGoldPriceFix, 10000);
    </script>
</body>
</html>
