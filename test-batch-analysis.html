<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量分析测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1a1a1a;
            margin-bottom: 24px;
        }
        .test-section {
            margin-bottom: 32px;
            padding: 16px;
            background: #f9f9f9;
            border-radius: 6px;
        }
        .test-section h2 {
            color: #333;
            margin-top: 0;
            font-size: 18px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        button:hover {
            background: #2563eb;
        }
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        .loading {
            color: #3b82f6;
            font-weight: 500;
        }
        .success {
            color: #10b981;
            font-weight: 500;
        }
        .error {
            color: #ef4444;
            font-weight: 500;
        }
        .result {
            margin-top: 16px;
            padding: 12px;
            background: white;
            border-radius: 4px;
            border: 1px solid #e5e7eb;
        }
        .news-item {
            margin-bottom: 16px;
            padding: 12px;
            background: #f0f9ff;
            border-left: 4px solid #3b82f6;
            border-radius: 4px;
        }
        .news-item.positive {
            background: #f0fdf4;
            border-left-color: #10b981;
        }
        .news-item.negative {
            background: #fef2f2;
            border-left-color: #ef4444;
        }
        .news-item.neutral {
            background: #f9fafb;
            border-left-color: #6b7280;
        }
        .news-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a1a1a;
        }
        .news-summary {
            font-size: 14px;
            color: #4b5563;
            margin-bottom: 8px;
        }
        .news-meta {
            font-size: 12px;
            color: #6b7280;
        }
        .overall-summary {
            padding: 16px;
            background: #eff6ff;
            border-radius: 6px;
            margin-top: 16px;
            border: 2px solid #3b82f6;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }
        .stat-card {
            padding: 12px;
            background: white;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
        }
        .stat-label {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }
        pre {
            background: #1f2937;
            color: #f3f4f6;
            padding: 12px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 批量分析功能测试</h1>
        
        <div class="test-section">
            <h2>测试说明</h2>
            <p>这个测试会模拟批量分析多条新闻，验证：</p>
            <ul>
                <li>✅ 一次API调用分析多条新闻</li>
                <li>✅ 每条新闻获得单独的分析结果</li>
                <li>✅ 提供整体市场影响评估</li>
                <li>✅ 本地分析降级方案</li>
            </ul>
        </div>

        <div class="test-section">
            <h2>测试控制</h2>
            <button id="testLocalBtn">测试本地批量分析</button>
            <button id="testAIBtn" disabled>测试AI批量分析（需要API密钥）</button>
            <div id="status" style="margin-top: 12px;"></div>
        </div>

        <div id="results"></div>
    </div>

    <script type="module">
        // 模拟新闻数据
        const mockNews = [
            {
                title: "美联储暗示可能降息，黄金价格上涨",
                content: "Federal Reserve officials hinted at potential interest rate cuts in the coming months, citing cooling inflation. Gold prices surged 2.5% as investors sought safe-haven assets."
            },
            {
                title: "美元走强施压黄金",
                content: "The US dollar strengthened against major currencies, putting pressure on gold prices. The dollar index rose 0.8%, making gold more expensive for foreign buyers."
            },
            {
                title: "地缘政治紧张局势支撑避险需求",
                content: "Rising geopolitical tensions in the Middle East boosted safe-haven demand for gold. Investors are closely monitoring the situation for potential escalation."
            },
            {
                title: "中国央行继续增持黄金储备",
                content: "China's central bank continued its gold buying spree, adding 15 tons to its reserves last month. This marks the 12th consecutive month of gold purchases."
            },
            {
                title: "通胀数据好于预期，黄金承压",
                content: "US inflation data came in lower than expected, reducing the appeal of gold as an inflation hedge. Consumer prices rose only 0.2% month-over-month."
            }
        ];

        // 本地分析逻辑（简化版）
        function localBatchAnalysis(newsList, assetType) {
            const analyses = newsList.map((news, index) => {
                const content = (news.title + ' ' + news.content).toLowerCase();
                
                // 简单的关键词分析
                const positiveWords = ['surge', 'rise', 'gain', 'boost', 'strong', 'buying'];
                const negativeWords = ['fall', 'pressure', 'weak', 'decline', 'drop'];
                
                let positiveCount = 0;
                let negativeCount = 0;
                
                positiveWords.forEach(word => {
                    if (content.includes(word)) positiveCount++;
                });
                
                negativeWords.forEach(word => {
                    if (content.includes(word)) negativeCount++;
                });
                
                let impact = 'neutral';
                let confidence = 0.5;
                let predictedChange = 0;
                
                if (positiveCount > negativeCount) {
                    impact = 'positive';
                    confidence = Math.min(0.5 + positiveCount * 0.15, 0.9);
                    predictedChange = positiveCount * 0.8;
                } else if (negativeCount > positiveCount) {
                    impact = 'negative';
                    confidence = Math.min(0.5 + negativeCount * 0.15, 0.9);
                    predictedChange = -negativeCount * 0.8;
                }
                
                return {
                    newsIndex: index,
                    impact,
                    confidence,
                    summary: `${news.title.substring(0, 80)}... 分析显示${impact === 'positive' ? '利好' : impact === 'negative' ? '利空' : '中性'}影响`,
                    keyPoints: [
                        `关键词分析: ${positiveCount}个利好词, ${negativeCount}个利空词`,
                        `置信度: ${(confidence * 100).toFixed(0)}%`,
                        `预测变化: ${predictedChange > 0 ? '+' : ''}${predictedChange.toFixed(2)}%`
                    ],
                    predictedChange
                };
            });
            
            // 计算整体影响
            const positiveCount = analyses.filter(a => a.impact === 'positive').length;
            const negativeCount = analyses.filter(a => a.impact === 'negative').length;
            const avgChange = analyses.reduce((sum, a) => sum + a.predictedChange, 0) / analyses.length;
            
            let overallImpact = 'neutral';
            if (positiveCount > negativeCount) {
                overallImpact = 'positive';
            } else if (negativeCount > positiveCount) {
                overallImpact = 'negative';
            }
            
            return {
                analyses,
                overallImpact,
                overallConfidence: analyses.reduce((sum, a) => sum + a.confidence, 0) / analyses.length,
                overallSummary: `综合分析${newsList.length}条新闻，${positiveCount}条利好，${negativeCount}条利空。整体趋势${overallImpact === 'positive' ? '偏向利好' : overallImpact === 'negative' ? '偏向利空' : '相对中性'}，预测平均变化${avgChange > 0 ? '+' : ''}${avgChange.toFixed(2)}%`
            };
        }

        // 显示结果
        function displayResults(result, timeTaken) {
            const resultsDiv = document.getElementById('results');
            
            const positiveCount = result.analyses.filter(a => a.impact === 'positive').length;
            const negativeCount = result.analyses.filter(a => a.impact === 'negative').length;
            const neutralCount = result.analyses.filter(a => a.impact === 'neutral').length;
            
            let html = `
                <div class="test-section">
                    <h2>📊 分析结果</h2>
                    
                    <div class="stats">
                        <div class="stat-card">
                            <div class="stat-value">${result.analyses.length}</div>
                            <div class="stat-label">新闻总数</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" style="color: #10b981;">${positiveCount}</div>
                            <div class="stat-label">利好</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" style="color: #ef4444;">${negativeCount}</div>
                            <div class="stat-label">利空</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" style="color: #6b7280;">${neutralCount}</div>
                            <div class="stat-label">中性</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${timeTaken}ms</div>
                            <div class="stat-label">分析耗时</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">1</div>
                            <div class="stat-label">API调用次数</div>
                        </div>
                    </div>
                    
                    <div class="overall-summary">
                        <h3 style="margin-top: 0;">🎯 整体市场影响</h3>
                        <p><strong>影响方向:</strong> <span style="color: ${result.overallImpact === 'positive' ? '#10b981' : result.overallImpact === 'negative' ? '#ef4444' : '#6b7280'};">${result.overallImpact === 'positive' ? '利好 📈' : result.overallImpact === 'negative' ? '利空 📉' : '中性 ➡️'}</span></p>
                        <p><strong>整体置信度:</strong> ${(result.overallConfidence * 100).toFixed(0)}%</p>
                        <p><strong>综合分析:</strong> ${result.overallSummary}</p>
                    </div>
                    
                    <h3 style="margin-top: 24px;">📰 各条新闻分析</h3>
            `;
            
            result.analyses.forEach((analysis, index) => {
                const news = mockNews[index];
                html += `
                    <div class="news-item ${analysis.impact}">
                        <div class="news-title">
                            [${index + 1}] ${news.title}
                            <span style="float: right; font-size: 12px; padding: 2px 8px; background: white; border-radius: 4px;">
                                ${analysis.impact === 'positive' ? '📈 利好' : analysis.impact === 'negative' ? '📉 利空' : '➡️ 中性'}
                            </span>
                        </div>
                        <div class="news-summary">${analysis.summary}</div>
                        <div class="news-meta">
                            <strong>置信度:</strong> ${(analysis.confidence * 100).toFixed(0)}% | 
                            <strong>预测变化:</strong> ${analysis.predictedChange > 0 ? '+' : ''}${analysis.predictedChange.toFixed(2)}%
                        </div>
                        <div style="margin-top: 8px; font-size: 12px;">
                            <strong>关键点:</strong>
                            <ul style="margin: 4px 0; padding-left: 20px;">
                                ${analysis.keyPoints.map(point => `<li>${point}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                `;
            });
            
            html += `
                    <h3 style="margin-top: 24px;">📋 原始数据</h3>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                </div>
            `;
            
            resultsDiv.innerHTML = html;
        }

        // 测试本地批量分析
        document.getElementById('testLocalBtn').addEventListener('click', async () => {
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('testLocalBtn');
            
            btn.disabled = true;
            statusDiv.innerHTML = '<span class="loading">⏳ 正在进行本地批量分析...</span>';
            
            try {
                const startTime = performance.now();
                
                // 模拟一点延迟
                await new Promise(resolve => setTimeout(resolve, 500));
                
                const result = localBatchAnalysis(mockNews, 'gold');
                
                const endTime = performance.now();
                const timeTaken = Math.round(endTime - startTime);
                
                statusDiv.innerHTML = `<span class="success">✅ 本地批量分析完成！耗时 ${timeTaken}ms</span>`;
                
                displayResults(result, timeTaken);
                
                console.log('批量分析结果:', result);
                
            } catch (error) {
                statusDiv.innerHTML = `<span class="error">❌ 分析失败: ${error.message}</span>`;
                console.error('分析错误:', error);
            } finally {
                btn.disabled = false;
            }
        });

        // 页面加载时自动运行测试
        window.addEventListener('load', () => {
            document.getElementById('testLocalBtn').click();
        });
    </script>
</body>
</html>
